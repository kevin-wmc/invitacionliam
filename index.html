<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Invitación</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-image: url('fondocarta.png'); /* tu imagen de fondo */
      background-size: cover;
      background-position: center;
    }

    .carta {
      width: 60%; /* más pequeño para que se vea el fondo */
      max-width: 300px; /* límite en pantallas grandes */
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .carta:hover {
      transform: scale(1.05);
    }

    /* Ajustes para pantallas pequeñas */
    @media (max-width: 600px) {
      .carta {
        width: 70%; /* ocupa menos espacio en celular */
      }
    }
  </style>
</head>
<body>
  <a href="invitacion.html"> <!-- tu enlace -->
    <img src="cartaclick.jpg" alt="Abrir invitación" class="carta"> <!-- tu carta -->
  </a>
</body>
</html>
