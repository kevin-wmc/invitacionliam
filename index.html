<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>carta de invitacion</title>
<style>
    /*fondo y posicion*/
    body {
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
       background: rgb(146, 124, 102);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
        overflow: hidden;
        height= "715px";
        width= "390px";
    }

    #globo{
        position: absolute;
    bottom:-150px;
    left:49%;
    transform:translateX(-50%);
    width:0px;
    height:910px;
    border-radius: 50%;
    cursor: pointer;
    animation: flotar 8s ease-in-out infinite alternate;
    display:flex;
    align-items:center;
    justify-content:center;
    }

@keyframes flotar{
    from{ transform:translateX(-50%) translateY(0); }
    to{ transform:translateX(-50%) translateY(-7px); }
}

</style>
</head>
<body>
    <figure class="fondo1">
        <img src="fondocarta.png" height= "765px" width= "460px" alt="fondo">
    </figure>
<div id="globo">
    <a href="invitacion.html">
    <figure>
        <img src="cartaclick.jpg" height="190px" width="330" alt="gpi">
    </figure>
    </a>
</div>

</body>

</html>
