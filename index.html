<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>carta de invitacion</title>

<style>

/* fondo */
body{
    margin:0;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: rgb(146,124,102);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    position:relative;
    height: 715px;
    width: 390px;
}

/* imagen de fondo */
.fondo1 img{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    top:0;
    left:0;
}

/* carta */
#carta{
    position:absolute;
    bottom:120px;
    left:50%;
    transform:translateX(-50%);
    animation:flotar 8s ease-in-out infinite alternate;
    align-items: center; 
    justify-content: center;
}

@keyframes flotar{
    from{ transform:translateX(-50%) translateY(0); }
    to{ transform:translateX(-50%) translateY(-7px); }
}

</style>
</head>

<body>

<figure class="fondo1">
<img src="fondocarta.png" alt="fondo">
</figure>

<div id="carta">
<a href="invitacion.html">
<figure>
<img src="cartaclick.jpg" width="330" alt="gpi">
</figure>
</a>
</div>

</body>
</html>
