<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>carta de invitacion</title>

<style>

body{
    margin:0;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

    /* imagen de fondo */
    background-image: url("fondocarta.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

/* carta */
#carta{
    animation:flotar 8s ease-in-out infinite alternate;
}

@keyframes flotar{
    from{ transform:translateY(0); }
    to{ transform:translateY(-7px); }
}

</style>
</head>

<body>

<div id="carta">
<a href="invitacion.html">
<img src="cartaclick.jpg" width="330" alt="gpi">
</a>
</div>

</body>
</html>
