Perfecto, te preparo un código base en HTML y CSS para que tengas tu página lista. Solo tendrás que reemplazar las rutas de las imágenes por las tuyas (la de fondo y la de la carta). Aquí va un ejemplo sencillo y adaptable:
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Invitación</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-image: url('fondo.jpg'); /* Aquí va tu imagen de fondo */
      background-size: cover;
      background-position: center;
    }

    .carta {
      width: 300px; /* Ajusta el tamaño según necesites */
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .carta:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <a href="invitacion.html"> <!-- Aquí enlazas tu invitación -->
    <img src="cartaclick.jpg" alt="Abrir invitación" class="carta"> <!-- Aquí va tu imagen de la carta -->
  </a>
</body>
</html>
