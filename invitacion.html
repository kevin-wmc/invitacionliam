    <div id="conteo">
        <div class="fecha">
        <p>¿Cuánto falta para el evento <span id="fecha">30/05/2026</span>?</p>
    </div>
    <div class="cuentaatras">
        <div class="grupo">
            <p class="grande" id="dias">00</p>
            <p class="chico">días</p>
        </div>
        <div class="grupo">
            <p class="grande" id="horas">00</p>
            <p class="chico">horas</p>
        </div>
        <div class="grupo">
            <p class="grande" id="minutos">00</p>
            <p class="chico">minutos</p>
        </div>
        <div class="grupo">
            <p class="grande" id="segundos">00</p>
            <p class="chico">segundos</p>
        </div>
    </div>

    <script>
        let fecha = new Date("May 30, 2026 11:00:00"); // usar minúscula
        let msFecha = fecha.getTime();

        let parrafoDias = document.querySelector("#dias");
        let parrafoHoras = document.querySelector("#horas");
        let parrafoMinutos = document.querySelector("#minutos");
        let parrafoSegundos = document.querySelector("#segundos");
        let spanFecha = document.querySelector("#fecha");

        spanFecha.innerText = fecha.toLocaleDateString();

        let intervalo = setInterval(() => {
            let hoy = new Date().getTime();
            let distancia = msFecha - hoy;

            let msPorDia = 1000 * 60 * 60 * 24;
            let msPorHora = 1000 * 60 * 60;
            let msPorMinuto = 1000 * 60;
            let msPorSegundo = 1000;

            let dias = Math.floor(distancia / msPorDia);
            let horas = Math.floor((distancia % msPorDia) / msPorHora);
            let minutos = Math.floor((distancia % msPorHora) / msPorMinuto);
            let segundos = Math.floor((distancia % msPorMinuto) / msPorSegundo);

            parrafoDias.innerText = dias;
            parrafoHoras.innerText = horas < 10 ? "0" + horas : horas;
            parrafoMinutos.innerText = minutos < 10 ? "0" + minutos : minutos;
            parrafoSegundos.innerText = segundos < 10 ? "0" + segundos : segundos;
            
            if(distancia < 0){
                clearInterval(intervalo);
            }
        }, 1000);
    </script>

  <script>
    function showInfo(num) {
      // Ocultar todas las secciones de info
      document.querySelectorAll('.info').forEach(div => div.classList.remove('active'));
      // Mostrar solo la seleccionada
      document.getElementById('info' + num).classList.add('active');
    }
  </script>
  <script>
  function showInfo(num) {
    // Ocultar todas las secciones de info
    document.querySelectorAll('.info').forEach(div => div.classList.remove('active'));
    // Mostrar solo la seleccionada
    document.getElementById('info' + num).classList.add('active');
  }

  // Detectar clic en cualquier parte del documento
  document.addEventListener('click', function(event) {
    // Verificar si el clic fue dentro de una imagen o dentro de una caja de info
    if (!event.target.closest('.column img') && !event.target.closest('.info')) {
      // Si no fue dentro, ocultar todas las cajas de info
      document.querySelectorAll('.info').forEach(div => div.classList.remove('active'));
    }
  });
</script>
